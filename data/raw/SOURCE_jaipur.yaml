site_details: Plant name (Fitpack Textiles, Jaipur), coordinates and the two inverter
  capacities (20 kW + 100 kW) are taken from the dataset. Capacity in data/systems.csv
  is the 120 kW inverter total; the DC array size is not published. Tilt, azimuth
  and commissioning date are not published and are left blank, not guessed.
preparation: tools/prepare_jaipur.py copies each day's date and plant total ('Main',
  kWh) from the original sheet (kept unmodified in data/source/) into data/raw/JAIPUR1_daily.csv.
  The year 2022 comes from the dataset description. No value is altered. Zero-energy
  days (27 in December, which the authors describe as a plant breakdown, and 3 in
  September) are kept as recorded.
permission_notes: CC BY 4.0 allows reuse with attribution; cite the dataset as above.
